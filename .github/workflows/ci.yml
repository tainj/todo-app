name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build todo-service
        run: mvn package -DskipTests -f todo-service/pom.xml

      - name: Build scheduler-service
        run: mvn package -DskipTests -f scheduler-service/pom.xml

      - name: Build notification-service
        run: mvn package -DskipTests -f notification-service/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        working-directory: front/frontend
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm build